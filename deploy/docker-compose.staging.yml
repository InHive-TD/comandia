# Comandia STAGING en el VPS. Proyecto aparte del de n8n: NO toca sus contenedores ni sus datos.
# Solo se conecta a la red de Caddy (la del proyecto "n8n") para que Caddy le pase el tráfico.
# Ningún puerto se publica al exterior: ni la app ni MySQL son alcanzables desde internet.
name: comandia-staging

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env.staging            # vive solo en el servidor; NUNCA va a GitHub
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fotos:/datos/uploads
    networks: [interna, caddy]
    mem_limit: 512m
    cpus: 0.6

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env.staging
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=60", "--performance-schema=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=-06:00"]
    volumes:
      - datos:/var/lib/mysql
    networks: [interna]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  datos:
  fotos:

networks:
  interna:
  caddy:
    external: true
    name: n8n_default                 # confirmar con: docker network ls (el nombre depende del proyecto de n8n)
