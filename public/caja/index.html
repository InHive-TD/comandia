<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Caja · Comandia</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="manifest" href="../api/manifest?p=caja">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <meta name="theme-color" content="#0a6b4e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="../js/pwa.js?v=1795493640" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css?v=1795493640">
  <link rel="stylesheet" href="../css/admin.css?v=1795493640">
  <link rel="stylesheet" href="../css/menu-barra.css?v=1795493640">
  <link rel="stylesheet" href="../css/caja.css?v=1795493640">
  <link rel="stylesheet" href="../css/shell.css?v=1795493640">
  <link rel="stylesheet" href="../api/tema.php">
</head>
<body data-shell="caja">

  <header class="encabezado barra con-menu">
    <div class="marca">
      <img class="logo" src="../api/logo.php" alt="Comandia" width="52" height="52">
      <div>
        <h1>Caja</h1>
        <p id="quien"></p>
      </div>
    </div>
    <button id="btn-menu" class="btn claro solo-celu" type="button" aria-label="Menú" aria-expanded="false" aria-controls="barra-caja">☰</button>
    <div class="barra-botones" id="barra-caja" hidden>
      <a class="btn claro" href="../pedidos/">➕ Tomar pedido</a>
      <a class="btn claro" href="../pedidos/?vista=curso">🍳 Preparando</a>
      <a class="btn claro activo" href="../caja/" aria-current="page">💵 Caja</a>
      <button id="btn-salir" class="btn claro" type="button">🚪 Salir</button>
    </div>
  </header>

  <main class="contenedor ancho">

    <section id="vista-login" class="tarjeta angosta" hidden>
      <h2>Iniciar sesión</h2>
      <form id="form-login" class="formulario">
        <label>Usuario
          <input id="login-usuario" type="text" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>Contraseña
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-msg" class="msg-error" role="alert"></p>
        <button class="btn principal" type="submit">Entrar</button>
      </form>
    </section>

    <section id="vista-aviso" class="tarjeta angosta" hidden>
      <h2 id="aviso-titulo"></h2>
      <p id="aviso-texto"></p>
    </section>

    <section id="vista-caja" hidden>
      <div class="caja-fecha">
        <label>Día
          <input id="fecha" type="date">
        </label>
        <button id="btn-hoy" class="btn" type="button">Hoy</button>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="pestanas" role="tablist">
        <button class="btn pestana" type="button" data-tab="cobrar" aria-pressed="true">Por cobrar <span id="n-cobrar"></span></button>
        <button class="btn pestana" type="button" data-tab="cobrados" aria-pressed="false">Cobrados</button>
        <button class="btn pestana" type="button" data-tab="propinas" aria-pressed="false">Propinas y corte</button>
      </div>

      <div id="panel" class="panel-caja"></div>
    </section>

  </main>

  <dialog id="dlg-cobro">
    <form id="form-cobro" class="formulario dialogo" novalidate>
      <h2 id="cb-titulo"></h2>
      <p id="cb-sub" class="ayuda"></p>

      <div class="cb-saldo"><span>Cuenta por pagar</span><strong id="cb-saldo"></strong></div>

      <fieldset class="cb-grupo">
        <legend>¿Cómo paga?</legend>
        <div id="cb-metodos" class="cb-opciones"></div>
      </fieldset>

      <fieldset class="cb-grupo">
        <legend>Propina</legend>
        <label>Propina que el cliente decidió dejar (déjalo en 0 si no dejó)
          <input id="cb-propina" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
        </label>
      </fieldset>

      <details id="cb-parte" class="cb-parte">
        <summary>Cobrar solo una parte (cuenta dividida)</summary>
        <label>Monto de la cuenta que se paga ahora
          <input id="cb-monto" type="number" inputmode="decimal" min="0.01" step="0.01">
        </label>
      </details>

      <div id="cb-efectivo" class="cb-efectivo" hidden>
        <label>Recibido en efectivo
          <input id="cb-recibido" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
        </label>
        <div id="cb-cambio" class="cb-cambio"></div>
      </div>

      <div id="cb-comision" class="cb-comision" hidden><span>Comisión por pagar con tarjeta <small>($3 + 3.7%)</small></span><strong id="cb-comision-monto"></strong></div>

      <div class="cb-total"><span>Total a cobrar</span><strong id="cb-total"></strong></div>

      <p id="cb-error" class="msg-error" role="alert"></p>
      <div class="acciones-dialogo">
        <button id="cb-cancelar" class="btn" type="button">Cancelar</button>
        <button id="cb-confirmar" class="btn principal grande" type="submit">Cobrar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-texto"></span>
  </div>

  <script src="../js/comun.js?v=1795493640"></script>
  <script src="../js/shell.js?v=1795493640"></script>
  <script src="../js/eventos.js?v=1795493640"></script>
  <script src="../js/caja.js?v=1795493640"></script>
</body>
</html>
