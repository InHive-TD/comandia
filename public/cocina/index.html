<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cocina · Comandia</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="manifest" href="../api/manifest?p=cocina">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <meta name="theme-color" content="#0a6b4e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="../js/pwa.js?v=1795493640" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css?v=1795493640">
  <link rel="stylesheet" href="../css/admin.css?v=1795493640">
  <link rel="stylesheet" href="../css/menu-barra.css?v=1795493640">
  <link rel="stylesheet" href="../css/cocina.css?v=1795493640">
  <link rel="stylesheet" href="../css/shell.css?v=1795493640">
  <link rel="stylesheet" href="../api/tema.php">
</head>
<body data-shell="cocina">

  <header class="encabezado barra con-menu">
    <div class="marca">
      <img class="logo" src="../api/logo.php" alt="Comandia" width="52" height="52">
      <div>
        <h1>Cocina</h1>
        <p id="quien"></p>
      </div>
    </div>
    <!-- Celular: ☰ abre el menú; tablet y computadora: una sola fila compacta (ver menu-barra.css) -->
    <button id="btn-menu" class="btn claro solo-celu" type="button" aria-label="Menú" aria-expanded="false" aria-controls="barra-cocina" hidden>☰</button>
    <div class="barra-botones" id="barra-cocina" hidden>
      <!-- Sonido: solo el icono (el texto cambia por JS en aria-label/title) -->
      <button id="btn-sonido" class="btn claro btn-icono" type="button" aria-label="Sonido" title="Sonido">🔔</button>
      <button id="btn-nombres" class="btn claro" type="button" aria-pressed="false">Ver por nombre</button>
      <button id="btn-salir" class="btn claro" type="button">Salir</button>
    </div>
  </header>

  <main class="contenedor ancho">

    <section id="vista-login" class="tarjeta angosta" hidden>
      <h2>Iniciar sesión</h2>
      <form id="form-login" class="formulario">
        <label>Usuario
          <input id="login-usuario" type="text" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>Contraseña
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-msg" class="msg-error" role="alert"></p>
        <button class="btn principal" type="submit">Entrar</button>
      </form>
    </section>

    <section id="vista-aviso" class="tarjeta angosta" hidden>
      <h2 id="aviso-titulo"></h2>
      <p id="aviso-texto"></p>
    </section>

    <!-- Tablero -->
    <section id="vista-tablero" hidden>
      <div class="resumen">
        <h2 id="titulo-parrilla"></h2>
        <span id="resumen-texto" class="ayuda"></span>
      </div>
      <div id="hamb" class="hamb" hidden></div>
      <div id="tablero" class="tablero" aria-live="off"></div>

      <div id="bloque-listas" class="listas" hidden>
        <h3>Listas para entregar <span id="cuenta-listas"></span></h3>
        <div id="listas" class="listas-chips"></div>
      </div>

      <!-- Pedidos agendados: sección al final, SIEMPRE colapsada al abrir; solo aparece si hay pedidos agendados.
           Cuando falta poco (hora − minutos de preparación) cada pedido pasa solo a la fila de cocina. -->
      <details id="bloque-prog" class="agendados" hidden>
        <summary>📅 Pedidos agendados <span id="cuenta-prog"></span></summary>
        <p class="ayuda">Aún no están en la fila: entran solos unos minutos antes de la hora. Toca uno para verlo o editarlo.</p>
        <div id="prog" class="agendados-lista"></div>
      </details>
    </section>

  </main>

  <dialog id="dlg-pedido">
    <div class="formulario dialogo">
      <h2 id="dp-titulo"></h2>
      <p class="ayuda">Cambia el estado o la cantidad, o quita un renglón si se acabó el producto.</p>
      <div id="dp-items" class="dp-items"></div>
      <p id="dp-error" class="msg-error" role="alert"></p>
      <div class="acciones-dialogo">
        <a id="dp-agregar" class="btn principal" href="#">＋ Agregar platillos</a>
        <button id="dp-cerrar" class="btn principal" type="button">Cerrar</button>
      </div>
    </div>
  </dialog>

  <button id="sonido-flotante" class="sonido-flotante" type="button" hidden>🔇 Sonido apagado · toca para activar</button>

  <div id="toast" class="toast con-accion" role="status" hidden>
    <span id="toast-texto"></span>
    <button id="toast-deshacer" class="btn" type="button" hidden>Deshacer</button>
  </div>

  <script src="../js/comun.js?v=1795493640"></script>
  <script src="../js/shell.js?v=1795493640"></script>
  <script src="../js/eventos.js?v=1795493640"></script>
  <script src="../js/cocina.js?v=1795493640"></script>
</body>
</html>
